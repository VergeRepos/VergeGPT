[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vergegpt-unrestricted"
version = "2.0.0"
description = "Unrestricted AI Assistant with File Protection"
readme = "README.md"
authors = [
    {name = "Verge", email = "verge@vergegpt.dev"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "colorama>=0.4.6",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pygments>=2.15.0",
]

[project.optional-dependencies]
gui = ["tkinter"]

[project.urls]
Homepage = "https://github.com/verge/vergegpt"
Repository = "https://github.com/verge/vergegpt"
Issues = "https://github.com/verge/vergegpt/issues"

[tool.setuptools]
packages = ["vergegpt"]

[tool.setuptools.package-data]
vergegpt = ["assets/*", "data/*", "themes/*.py"]
